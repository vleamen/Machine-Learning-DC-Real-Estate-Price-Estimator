version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vincentnguyen
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dc_housing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://vincentnguyen:password@db:5432/dc_housing_db
    depends_on:
      - db

volumes:
  postgres_data: